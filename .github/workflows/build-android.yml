name: CI Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Load Android build config
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = {"ANDROID_COMPILE_SDK", "ANDROID_TARGET_SDK", "ANDROID_BUILD_TOOLS"}
          env_file = Path(os.environ["GITHUB_ENV"])

          for raw_line in Path("android-twa/gradle.properties").read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue

              key, value = line.split("=", 1)
              if key in keys:
                  with env_file.open("a", encoding="utf-8") as handle:
                      handle.write(f"{key}={value}\n")
          PY

      - name: Install Android platform
        run: sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Lint debug build
        run: gradle -p android-twa lintDebug

      - name: Assemble debug build
        run: gradle -p android-twa assembleDebug
